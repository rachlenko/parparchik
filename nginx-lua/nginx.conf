worker_processes auto;
error_log /dev/stderr info;
pid       /tmp/nginx.pid;

env PARPARCHIK_PUBLIC_BUCKET;
env PARPARCHIK_PRIVATE_BUCKET;
env PARPARCHIK_BUCKETS;
env PARPARCHIK_REGISTRY_MANIFEST_KEY;
env PARPARCHIK_HOST;
env PARPARCHIK_PORT;
env S3_ENDPOINT;
env S3_EXTERNAL_ENDPOINT;
env AWS_REGION;
env AWS_ACCESS_KEY_ID;
env AWS_SECRET_ACCESS_KEY;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict file_registry 10m;

    lua_package_path "/opt/parparchik/lua/?.lua;;";

    # Resolve DNS for S3/MinIO requests
    resolver 127.0.0.11 ipv6=off valid=10s;

    init_worker_by_lua_block {
        -- Only run init on worker 0 to avoid duplicate S3 syncs
        if ngx.worker.id() == 0 then
            ngx.timer.at(0, function()
                local ok, err = pcall(function()
                    local handlers = require "handlers"
                    handlers.init()
                end)
                if not ok then
                    ngx.log(ngx.ERR, "parparchik init failed: ", err)
                end
            end)
        end
    }

    server {
        listen 8080;
        server_name _;

        access_log /dev/stdout;

        # --- API routes ---

        location = /status {
            content_by_lua_block {
                require("handlers").handle_status()
            }
        }

        location = /list {
            content_by_lua_block {
                require("handlers").handle_list()
            }
        }

        location = /update {
            content_by_lua_block {
                require("handlers").handle_update()
            }
        }

        location = /relocate {
            content_by_lua_block {
                require("handlers").handle_relocate()
            }
        }

        location = /metrics {
            content_by_lua_block {
                require("handlers").handle_metrics()
            }
        }

        location = /healthcheck {
            content_by_lua_block {
                require("handlers").handle_healthcheck()
            }
        }

        location = /redines {
            content_by_lua_block {
                require("handlers").handle_readiness()
            }
        }

        location = /readiness {
            content_by_lua_block {
                require("handlers").handle_readiness()
            }
        }

        # --- File download routes (/<bucket-name>/<key>) ---
        # Matches any /<segment>/<path> pattern; Lua validates bucket name.

        location ~ ^/[^/]+/.+ {
            content_by_lua_block {
                require("handlers").handle_download()
            }
        }

        # Catch-all for 404
        location / {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.status = 404
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ error = "not found" }))
                ngx.exit(404)
            }
        }
    }
}
